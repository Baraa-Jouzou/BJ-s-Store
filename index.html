<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJ's Store | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #00ff88;
            --p-glow: rgba(0, 255, 136, 0.4);
            --bg: #050505;
            --surface: #0e0e11;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --hot-deal: #ff3366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--p); border-radius: 10px; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background Aura */
        body::before {
            content: "";
            position: fixed;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            background: radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.08), transparent 50%),
                        radial-gradient(circle at 0% 100%, rgba(0, 255, 136, 0.05), transparent 40%);
            z-index: -1;
            animation: auraShift 15s infinite alternate ease-in-out;
        }

        @keyframes auraShift {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(2%, 2%) scale(1.05); }
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 8%; background: rgba(5, 5, 5, 0.7); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-family: 'Syncopate', sans-serif; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; }
        .brand span { color: var(--p); text-shadow: 0 0 15px var(--p-glow); }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
            padding: 50px 8%; 
        }

        /* Card Design */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .card::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.03), transparent);
            transform: rotate(45deg);
            transition: 0.6s;
        }

        .card:hover {
            border-color: var(--p);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(0,255,136,0.1);
        }
        
        .card:hover::after { left: 100%; }

        .card-img-wrap {
            width: 90px; height: 90px; margin: 0 auto 25px; background: #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            overflow: hidden; padding: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.4s;
        }
        .card:hover .card-img-wrap { transform: scale(1.1) rotate(5deg); }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Buttons */
        .btn { 
            padding: 14px 24px; border-radius: 14px; font-weight: 800; border: none; 
            cursor: pointer; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn:active { transform: scale(0.95); }
        .btn-p { background: var(--p); color: #000; box-shadow: 0 4px 15px var(--p-glow); }
        .btn-p:hover { background: #fff; box-shadow: 0 8px 25px rgba(255,255,255,0.2); }
        .btn-outline { background: transparent; border: 1.5px solid var(--p); color: var(--p); width: 100%; }
        .btn-outline:hover { background: var(--p); color: #000; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            nav { padding: 18px 5%; }
            .grid { grid-template-columns: 1fr 1fr; gap: 15px; padding: 25px 5%; }
            .card { padding: 20px; border-radius: 18px; }
            .card h3 { font-size: 0.85rem; margin-bottom: 10px; }
            .card-img-wrap { width: 65px; height: 65px; padding: 10px; margin-bottom: 15px; }
            .btn { padding: 10px; font-size: 0.7rem; }
        }

        /* Elements & Modals */
        .overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(10px); display: none; z-index: 2000; 
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .drawer { 
            position: fixed; top: 0; right: -100%; width: 420px; max-width: 100%; height: 100%; 
            background: var(--surface); z-index: 2100; transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1); 
            display: flex; flex-direction: column; border-left: 1px solid var(--border);
        }
        .drawer.open { right: 0; box-shadow: -20px 0 60px rgba(0,0,0,0.5); }

        .modal { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -40%); 
            background: var(--surface); border: 1px solid var(--border); padding: 35px; 
            border-radius: 30px; width: 92%; max-width: 420px; z-index: 2200; 
            display: none; box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            transition: 0.3s;
        }
        .modal.active { transform: translate(-50%, -50%); display: block; }

        .pack-row { 
            display: flex; justify-content: space-between; padding: 18px; 
            background: var(--glass); border-radius: 15px; margin-bottom: 12px; 
            cursor: pointer; border: 1px solid transparent; transition: 0.3s; 
        }
        .pack-row:hover { 
            background: rgba(0,255,136,0.08); border-color: var(--p); transform: translateX(5px);
        }

        #admin-dash {
            display: none; padding: 50px 8%; background: #000; border-bottom: 2px solid var(--p);
            animation: slideDown 0.5s ease;
        }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<div id="admin-dash">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px">
        <h2 style="font-family:'Syncopate'; color:var(--p)">SYSTEM_DASHBOARD</h2>
        <button class="btn" style="background:#ff3366; color:#fff" onclick="closeAdmin()">SAVE & LOGOUT</button>
    </div>
    <div id="admin-editor-content" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px;"></div>
</div>

<nav>
    <div class="brand" onclick="location.reload()">BJ'S<span> STORE</span></div>
    <div style="display:flex; gap:12px">
        <button class="btn" style="background:var(--glass); color:#fff; padding:12px" onclick="authAdmin()">⚙️</button>
        <button class="btn btn-p" onclick="toggleDrawer('cart-drawer', true)">🛒 <span id="cart-count">0</span></button>
    </div>
</nav>

<div class="grid" id="store-grid"></div>

<div class="overlay" id="sys-overlay" onclick="closeAll()"></div>

<div class="drawer" id="cart-drawer">
    <div style="padding:30px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
        <h2 style="font-family:'Syncopate'; font-size:0.9rem">BASKET_CONTENTS</h2>
        <span onclick="closeAll()" style="cursor:pointer; font-size:1.5rem">✕</span>
    </div>
    <div id="cart-items" style="flex:1; overflow-y:auto; padding:30px"></div>
    <div style="padding:30px; background: rgba(0,0,0,0.3)">
        <div style="display:flex; justify-content:space-between; margin-bottom:25px">
            <span style="color:var(--text-muted); font-weight:600">SUBTOTAL</span>
            <b id="cart-total" style="color:var(--p); font-size:1.6rem">$0.00</b>
        </div>
        <button class="btn btn-p" style="width:100%; padding:18px" onclick="checkout()">PROCEED TO WHATSAPP</button>
    </div>
</div>

<div class="modal" id="pack-modal">
    <h2 id="m-title" style="margin-bottom:25px; text-align:center; font-family:'Syncopate'; font-size:1rem; color:var(--p)"></h2>
    <div id="m-opts"></div>
    <button class="btn" style="width:100%; margin-top:20px; color:var(--text-muted)" onclick="closeAll()">CANCEL</button>
</div>

<script>
    const DEFAULT_DB = [
        { n: "Roblox", img: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg", pk: [{l: "1000 Robux", p: "12.99"}, {l: "2000 Robux", p: "24.99"}] },
        { n: "Riot Client", img: "https://upload.wikimedia.org/wikipedia/commons/1/11/Riot_Games_logo_icon.svg", pk: [{l: "1000 RP", p: "11.99"}, {l: "2500 RP", p: "26.99"}] },
        { n: "EA App", img: "https://upload.wikimedia.org/wikipedia/commons/0/0d/Electronic-Arts-Logo.svg", pk: [{l: "$15 Card", p: "16.50"}, {l: "$25 Card", p: "27.00"}] },
        { n: "FC 26 Points", img: "https://media.rawg.io/media/games/052/052ccae9ef18037f485f6170087a5f48.jpg", pk: [{l: "1050 Points", p: "11.99"}, {l: "2800 Points", p: "26.99"}] },
        { n: "Steam Card", img: "https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg", pk: [{l: "$10 Wallet", p: "12.00"}, {l: "$20 Wallet", p: "23.99"}] },
        { n: "Xbox Link", img: "https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg", pk: [{l: "$10 Gift Card", p: "11.99"}, {l: "$25 Gift Card", p: "27.99"}] },
        { n: "Discord Nitro", img: "https://www.svgrepo.com/show/353655/discord-icon.svg", pk: [{l: "1 Month Boost", p: "11.99"}] },
        { n: "PlayStation", img: "https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg", pk: [{l: "$10 PSN", p: "11.50"}] },
        { n: "Anghami", img: "https://anghami.com/web/assets/images/anghami-logo-icon.png", pk: [{l: "1 Month Plus", p: "6.99"}, {l: "(HOT DEAL) 3 Months Plus", p: "10.99"}] },
        { n: "Spotify", img: "https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg", pk: [{l: "1 Month Premium", p: "7.99"}] },
        { n: "iTunes", img: "https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg", pk: [{l: "$12 Gift Card", p: "13.99"}, {l: "$24 Gift Card", p: "25.99"}] }
    ];

    let storeData = JSON.parse(localStorage.getItem("bj_v31_db")) || DEFAULT_DB;
    let basket = [];

    function renderStore() {
        const grid = document.getElementById('store-grid');
        grid.innerHTML = '';
        storeData.forEach((it, i) => {
            grid.innerHTML += `
                <div class="card">
                    <div class="card-img-wrap"><img src="${it.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3>${it.n}</h3>
                    <br>
                    <button class="btn btn-outline" onclick="openPack(${i})">VIEW PACKS</button>
                </div>`;
        });
        grid.innerHTML += `<div class="card" style="border:1px dashed var(--border); opacity:0.4; display:flex; align-items:center; justify-content:center; min-height:200px"><h3>+ MORE COMMING</h3></div>`;
    }

    function openPack(i) {
        const it = storeData[i];
        document.getElementById('m-title').innerText = it.n;
        const box = document.getElementById('m-opts');
        box.innerHTML = '';
        it.pk.forEach(p => {
            box.innerHTML += `<div class="pack-row" onclick="add('${it.n}','${p.l.replace(/'/g, "\\'")}','${p.p}')"><span>${p.l}</span><b>$${p.p}</b></div>`;
        });
        document.getElementById('sys-overlay').style.display = 'block';
        document.getElementById('pack-modal').classList.add('active');
    }

    function add(n, l, p) {
        basket.push({n, l, p});
        updCart(); closeAll();
        toggleDrawer('cart-drawer', true);
    }

    function updCart() {
        document.getElementById('cart-count').innerText = basket.length;
        const list = document.getElementById('cart-items');
        let total = 0; list.innerHTML = '';
        basket.forEach((x, i) => {
            total += parseFloat(x.p);
            list.innerHTML += `<div style="background:var(--glass); padding:18px; border-radius:18px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center">
                <div><b style="font-size:0.9rem">${x.n}</b><br><small style="color:var(--text-muted)">${x.l}</small></div>
                <div style="display:flex; gap:12px; align-items:center"><b>$${x.p}</b><span onclick="basket.splice(${i},1);updCart()" style="color:#ff3366; cursor:pointer; font-weight:bold">✕</span></div>
            </div>`;
        });
        document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    function authAdmin() {
        if(prompt("ACCESS KEY REQUIRED:") === "1234") {
            document.getElementById('admin-dash').style.display = 'block';
            renderAdmin();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    }

    function renderAdmin() {
        const content = document.getElementById('admin-editor-content');
        content.innerHTML = '';
        storeData.forEach((it, i) => {
            let itemHtml = `<div style="background:var(--surface); padding:20px; border-radius:20px; border:1px solid var(--border)">
                <h4 style="color:var(--p); margin-bottom:15px">${it.n}</h4>`;
            it.pk.forEach((p, pi) => {
                itemHtml += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
                        <small style="color:var(--text-muted)">${p.l}</small>
                        <input type="number" step="0.01" style="width:80px; background:#000; border:1px solid var(--border); color:var(--p); padding:6px; border-radius:8px; text-align:center" value="${p.p}" oninput="savePrice(${i}, ${pi}, this.value)">
                    </div>`;
            });
            itemHtml += `</div>`;
            content.innerHTML += itemHtml;
        });
    }

    function savePrice(itIdx, pkIdx, val) {
        storeData[itIdx].pk[pkIdx].p = val;
        localStorage.setItem("bj_v31_db", JSON.stringify(storeData));
        renderStore();
    }

    function closeAdmin() { document.getElementById('admin-dash').style.display = 'none'; }
    function toggleDrawer(id, state) {
        if(state) document.getElementById('sys-overlay').style.display = 'block';
        document.getElementById(id).classList.toggle('open', state);
    }
    function closeAll() {
        document.getElementById('sys-overlay').style.display = 'none';
        document.getElementById('pack-modal').classList.remove('active');
        document.getElementById('cart-drawer').classList.remove('open');
    }

    function checkout() {
        if(!basket.length) return;
        let msg = `🛒 *BJ'S STORE ORDER*\n\n`;
        basket.forEach(it => msg += `• ${it.n}: ${it.l} ($${it.p})\n`);
        window.open(`https://wa.me/96181094708?text=${encodeURIComponent(msg)}`);
    }

    renderStore();
</script>
</body>
</html>
