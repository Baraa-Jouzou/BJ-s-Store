<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BJ's Store | Premium Digital Goods</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&amp;family=Plus+Jakarta+Sans:wght@400;600;800&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #00ff88;
            --p-glow: rgba(0, 255, 136, 0.3);
            --bg: #030303;
            --surface: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: #888888;
            --hot-deal: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--p); border-radius: 10px; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.08), transparent 70%);
            overflow-x: hidden;
        }

        /* --- Navigation --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(3, 3, 3, 0.8); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-family: 'Syncopate', sans-serif; font-size: 1rem; cursor: pointer; letter-spacing: 1px; }
        .brand span { color: var(--p); }

        /* --- Grid & Cards --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
            padding: 20px 5%; 
        }
        
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
            .brand { font-size: 1.2rem; }
        }

        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            padding: 20px; text-align: center; transition: 0.3s; display: flex; flex-direction: column;
            justify-content: space-between;
        }
        .card:active { transform: scale(0.95); }
        .card:hover { border-color: var(--p); }

        .card-img-wrap {
            width: 60px; height: 60px; margin: 0 auto 15px; background: #fff;
            border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .card img { width: 40px; height: 40px; object-fit: contain; }

        /* --- Admin Dash --- */
        #admin-dash {
            display: none; padding: 30px 5%; background: #000; border-bottom: 2px solid var(--p);
            animation: slideDown 0.4s ease forwards;
        }
        @keyframes slideDown { from { opacity:0; transform: translateY(-10px); } to { opacity:1; transform: translateY(0); } }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .admin-box { background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .admin-input-group { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        
        .admin-input { 
            width: 70px; background: #111; border: 1px solid var(--border); 
            color: var(--p); padding: 6px; border-radius: 6px; text-align: center; font-weight: 800;
        }

        /* --- Components --- */
        .btn { padding: 12px 15px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; transition: 0.2s; }
        .btn-p { background: var(--p); color: #000; box-shadow: 0 4px 15px var(--p-glow); }
        .btn-outline { background: transparent; border: 1px solid var(--p); color: var(--p); width: 100%; margin-top: 10px; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; z-index: 2000; }
        
        .drawer { 
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; 
            background: var(--surface); z-index: 2100; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            display: flex; flex-direction: column; 
        }
        .drawer.open { right: 0; }

        .modal { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: var(--surface); border: 1px solid var(--border); padding: 25px; 
            border-radius: 20px; width: 90%; max-width: 380px; z-index: 2200; display: none; 
        }

        .pack-row { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: var(--glass); border-radius: 12px; margin-bottom: 8px; 
            cursor: pointer; border: 1px solid transparent;
        }
        .pack-row:hover { border-color: var(--p); background: rgba(0,255,136,0.05); }
        .hot-deal-text { color: var(--hot-deal); font-weight: 800; font-size: 0.8rem; }

        .cart-item {
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; 
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

<!-- Admin Dashboard -->
<div id="admin-dash">
    <div class="admin-header">
        <h2 style="font-size: 0.9rem; color:var(--p)">CONSOLE</h2>
        <button class="btn" style="background:#ff4444; color:#fff" onclick="closeAdmin()">CLOSE</button>
    </div>
    <div class="admin-grid" id="admin-editor-content"></div>
</div>

<!-- Nav -->
<nav>
    <div class="brand" onclick="location.reload()">BJ'S<span> STORE</span></div>
    <div style="display:flex; gap:8px">
        <button class="btn" style="background:var(--glass); color:#fff; padding: 10px;" onclick="authAdmin()">⚙️</button>
        <button class="btn btn-p" onclick="toggleDrawer('cart-drawer', true)">🛒 <span id="cart-count">0</span></button>
    </div>
</nav>

<!-- Main Store -->
<div class="grid" id="store-grid"><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">Roblox</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(0)">VIEW PACKS</button>
            </div><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://cdn-icons-png.flaticon.com/512/702/702115.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">Riot Client</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(1)">VIEW PACKS</button>
            </div><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0d/Electronic-Arts-Logo.svg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">EA App</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(2)">VIEW PACKS</button>
            </div><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://cdn-icons-png.flaticon.com/512/702/702115.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">FC 26 Points</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(3)">VIEW PACKS</button>
            </div><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">Steam Card</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(4)">VIEW PACKS</button>
            </div><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">Xbox Link</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(5)">VIEW PACKS</button>
            </div><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://www.svgrepo.com/show/353655/discord-icon.svg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">Discord Nitro</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(6)">VIEW PACKS</button>
            </div><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">PlayStation</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(7)">VIEW PACKS</button>
            </div><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://cdn-icons-png.flaticon.com/512/702/702115.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">Anghami</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(8)">VIEW PACKS</button>
            </div><div class="card">
                <div>
                    <div class="card-img-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">Spotify</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(9)">VIEW PACKS</button>
            </div></div>

<!-- Overlay -->
<div class="overlay" id="sys-overlay" onclick="closeAll()"></div>

<!-- Cart Drawer -->
<div class="drawer" id="cart-drawer">
    <div style="padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
        <h2 style="font-family:'Syncopate'; font-size:0.9rem">YOUR BASKET</h2>
        <button class="btn" onclick="closeAll()" style="background:none; color:#fff; font-size:1.2rem">✕</button>
    </div>
    <div id="cart-items" style="flex:1; overflow-y:auto; padding:20px"></div>
    <div style="padding:20px; border-top:1px solid var(--border); background: var(--surface)">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px">
            <span style="color:var(--text-muted)">TOTAL AMOUNT</span>
            <b id="cart-total" style="color:var(--p); font-size:1.4rem">$0.00</b>
        </div>
        <button class="btn btn-p" style="width:100%; padding:18px" onclick="checkout()">ORDER VIA WHATSAPP</button>
    </div>
</div>

<!-- Pack Modal -->
<div class="modal" id="pack-modal">
    <h2 id="m-title" style="margin-bottom:20px; text-align:center; font-family:'Syncopate'; font-size:0.9rem; color:var(--p)"></h2>
    <div id="m-opts"></div>
    <button class="btn" style="width:100%; margin-top:15px; color:var(--text-muted)" onclick="closeAll()">CANCEL</button>
</div>

<script>
    const DEFAULT_DB = [
        { n: "Roblox", img: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg", pk: [{l: "1000 Robux", p: "10"}, {l: "2000 Robux", p: "20"}] },
        { n: "Riot Client", img: "https://upload.wikimedia.org/wikipedia/commons/1/11/Riot_Games_logo_icon.svg", pk: [{l: "1000 RP", p: "10"}, {l: "2500 RP", p: "25"}] },
        { n: "EA App", img: "https://upload.wikimedia.org/wikipedia/commons/0/0d/Electronic-Arts-Logo.svg", pk: [{l: "$15 Card", p: "15"}, {l: "$25 Card", p: "25"}] },
        { n: "FC 26 Points", img: "https://media.rawg.io/media/games/052/052ccae9ef18037f485f6170087a5f48.jpg", pk: [{l: "1050 Points", p: "12"}, {l: "2800 Points", p: "25"}] },
        { n: "Steam Card", img: "https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg", pk: [{l: "$10 Wallet", p: "11"}, {l: "$20 Wallet", p: "22"}] },
        { n: "Xbox Link", img: "https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg", pk: [{l: "$10 Gift Card", p: "10"}, {l: "$25 Gift Card", p: "25"}] },
        { n: "Discord Nitro", img: "https://www.svgrepo.com/show/353655/discord-icon.svg", pk: [{l: "1 Month Boost", p: "10"}] },
        { n: "PlayStation", img: "https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg", pk: [{l: "$10 PSN", p: "11"}] },
        { n: "Anghami", img: "https://upload.wikimedia.org/wikipedia/commons/b/b5/Anghami_logo.svg", pk: [{l: "1 Month Plus", p: "7"}, {l: "(HOT DEAL) 3 Months Plus", p: "10"}] },
        { n: "Spotify", img: "https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg", pk: [{l: "1 Month Premium", p: "7"}] }
    ];

    let storeData = JSON.parse(localStorage.getItem("bj_store_v2")) || DEFAULT_DB;
    let basket = [];

    // --- Core Logic ---
    function renderStore() {
        const grid = document.getElementById('store-grid');
        grid.innerHTML = '';
        storeData.forEach((it, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="card-img-wrap"><img src="${it.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3 style="font-size:0.9rem">${it.n}</h3>
                </div>
                <button class="btn btn-outline" onclick="openPack(${i})">VIEW PACKS</button>
            `;
            grid.appendChild(card);
        });
    }

    function openPack(i) {
        const it = storeData[i];
        document.getElementById('m-title').innerText = it.n;
        const box = document.getElementById('m-opts');
        box.innerHTML = '';
        it.pk.forEach(p => {
            const isHot = p.l.includes("HOT DEAL");
            box.innerHTML += `
                <div class="pack-row" onclick="addToBasket(${i}, '${p.l.replace(/'/g, "\\'")}', '${p.p}')">
                    <div style="display:flex; flex-direction:column">
                        <span style="font-size:0.9rem; font-weight:600">${p.l}</span>
                        ${isHot ? '<span class="hot-deal-text">SPECIAL OFFER</span>' : ''}
                    </div>
                    <b style="color:var(--p)">$${p.p}</b>
                </div>`;
        });
        document.getElementById('sys-overlay').style.display = 'block';
        document.getElementById('pack-modal').style.display = 'block';
    }

    function addToBasket(idx, label, price) {
        basket.push({ n: storeData[idx].n, l: label, p: price });
        updateCartUI();
        closeAll();
        toggleDrawer('cart-drawer', true);
    }

    function updateCartUI() {
        document.getElementById('cart-count').innerText = basket.length;
        const list = document.getElementById('cart-items');
        let total = 0; 
        list.innerHTML = '';
        
        basket.forEach((x, i) => {
            total += parseFloat(x.p);
            list.innerHTML += `
                <div class="cart-item">
                    <div>
                        <b style="font-size:0.85rem">${x.n}</b><br>
                        <small style="color:var(--text-muted)">${x.l}</small>
                    </div>
                    <div style="display:flex; gap:12px; align-items:center">
                        <b>$${x.p}</b>
                        <span onclick="removeFromBasket(${i})" style="color:#ff4444; cursor:pointer; padding:5px">✕</span>
                    </div>
                </div>`;
        });
        document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    function removeFromBasket(i) {
        basket.splice(i, 1);
        updateCartUI();
    }

    // --- Admin Functions ---
    function authAdmin() {
        const pin = prompt("Enter Admin PIN:");
        if(pin === "1234") {
            document.getElementById('admin-dash').style.display = 'block';
            renderAdmin();
            window.scrollTo({top: 0, behavior: 'smooth'});
        } else if(pin !== null) {
            alert("Incorrect PIN");
        }
    }

    function renderAdmin() {
        const content = document.getElementById('admin-editor-content');
        content.innerHTML = '';
        storeData.forEach((it, i) => {
            let itemHtml = `<div class="admin-box"><h4 style="font-size:0.8rem; color:var(--text-muted)">${it.n}</h4>`;
            it.pk.forEach((p, pi) => {
                itemHtml += `
                    <div class="admin-input-group">
                        <small style="font-size:0.7rem">${p.l}</small>
                        <input type="number" step="0.1" class="admin-input" value="${p.p}" 
                               onchange="updatePrice(${i}, ${pi}, this.value)">
                    </div>`;
            });
            itemHtml += `</div>`;
            content.innerHTML += itemHtml;
        });
    }

    function updatePrice(itIdx, pkIdx, newVal) {
        storeData[itIdx].pk[pkIdx].p = newVal;
        localStorage.setItem("bj_store_v2", JSON.stringify(storeData));
        renderStore(); // Update the main store view instantly
    }

    function closeAdmin() { 
        document.getElementById('admin-dash').style.display = 'none'; 
    }

    // --- UI Helpers ---
    function toggleDrawer(id, state) {
        if(state) document.getElementById('sys-overlay').style.display = 'block';
        document.getElementById(id).classList.toggle('open', state);
    }

    function closeAll() {
        document.getElementById('sys-overlay').style.display = 'none';
        document.getElementById('pack-modal').style.display = 'none';
        document.getElementById('cart-drawer').classList.remove('open');
    }

    function checkout() {
        if(!basket.length) return alert("Basket is empty!");
        let msg = `🛒 *NEW ORDER - BJ'S STORE*\n\n`;
        basket.forEach(it => msg += `• *${it.n}*: ${it.l} ($${it.p})\n`);
        const total = basket.reduce((acc, curr) => acc + parseFloat(curr.p), 0);
        msg += `\n💰 *Total: $${total.toFixed(2)}*`;
        
        const phone = "96181094708";
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
    }

    // Initialize
    renderStore();
</script>

</body></html>
