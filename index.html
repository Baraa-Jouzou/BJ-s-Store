<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJ's Store | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #00ff88;
            --p-glow: rgba(0, 255, 136, 0.3);
            --bg: #030303;
            --surface: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--p); border-radius: 10px; }

        body {
            background: var(--bg); color: var(--text); min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.05), transparent 60%);
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 6%; background: rgba(3, 3, 3, 0.85); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-family: 'Syncopate', sans-serif; font-size: 1.2rem; cursor: pointer; letter-spacing: 2px; }
        .brand span { color: var(--p); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; padding: 40px 6%; }
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            padding: 30px; text-align: center; transition: 0.3s;
        }
        .card:hover { border-color: var(--p); transform: translateY(-5px); }
        .card-img-wrap {
            width: 80px; height: 80px; margin: 0 auto 20px; background: #fff;
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
        }
        .card img { width: 50px; height: 50px; object-fit: contain; }

        #admin-dash {
            display: none; padding: 40px 6%; background: #000; border-bottom: 2px solid var(--p);
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform: translateY(0); } }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .admin-box { background: var(--surface); padding: 20px; border-radius: 15px; border: 1px solid var(--border); }
        .admin-input-group { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .admin-input { 
            width: 85px; background: #111; border: 1px solid var(--border); 
            color: var(--p); padding: 8px; border-radius: 8px; text-align: center; font-weight: 800; font-size: 0.7rem;
        }

        .btn { padding: 12px 20px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; }
        .btn-p { background: var(--p); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--p); color: var(--p); width: 100%; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; z-index: 2000; }
        .drawer { position: fixed; top: 0; right: -100%; width: 400px; max-width: 100%; height: 100%; background: var(--surface); z-index: 2100; transition: 0.4s; display: flex; flex-direction: column; }
        .drawer.open { right: 0; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--surface); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; z-index: 2200; display: none; }

        .pack-row { display: flex; justify-content: space-between; padding: 15px; background: var(--glass); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .pack-row:hover:not(.oos) { background: rgba(0,255,136,0.1); border-left: 4px solid var(--p); }
        .pack-row.oos { opacity: 0.5; cursor: not-allowed; border: 1px dashed var(--border); }

        @media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr; gap: 15px; } .drawer { width: 100%; } }
    </style>
</head>
<body>

<div id="admin-dash">
    <div class="admin-header">
        <div>
            <h2 style="font-family:'Syncopate'; color:var(--p)">MANAGEMENT CONSOLE</h2>
            <p style="font-size: 0.7rem; color: var(--text-muted)">Type "OUT OF STOCK" to disable a pack.</p>
        </div>
        <button class="btn" style="background:#ff4444; color:#fff" onclick="closeAdmin()">CLOSE</button>
    </div>
    <div class="admin-grid" id="admin-editor-content"></div>
</div>

<nav>
    <div class="brand" onclick="location.reload()">BJ'S<span> STORE</span></div>
    <div style="display:flex; gap:10px">
        <button class="btn" style="background:var(--glass); color:#fff" onclick="authAdmin()">⚙️ ADMIN</button>
        <button class="btn btn-p" onclick="toggleDrawer('cart-drawer', true)">🛒 <span id="cart-count">0</span></button>
    </div>
</nav>

<div class="grid" id="store-grid"></div>

<div class="overlay" id="sys-overlay" onclick="closeAll()"></div>

<div class="drawer" id="cart-drawer">
    <div style="padding:25px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between">
        <h2 style="font-family:'Syncopate'; font-size:1rem">YOUR BASKET</h2>
        <span onclick="closeAll()" style="cursor:pointer">✕</span>
    </div>
    <div id="cart-items" style="flex:1; overflow-y:auto; padding:25px"></div>
    <div style="padding:25px; border-top:1px solid var(--border)">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px">
            <span style="color:var(--text-muted)">TOTAL</span>
            <b id="cart-total" style="color:var(--p); font-size:1.5rem">$0.00</b>
        </div>
        <button class="btn btn-p" style="width:100%" onclick="checkout()">ORDER VIA WHATSAPP</button>
    </div>
</div>

<div class="modal" id="pack-modal">
    <h2 id="m-title" style="margin-bottom:20px; text-align:center; font-family:'Syncopate'; font-size:1rem"></h2>
    <div id="m-opts"></div>
    <button class="btn" style="width:100%; margin-top:15px; color:var(--text-muted)" onclick="closeAll()">GO BACK</button>
</div>

<script>
    /* --- SYNCED WITH YOUR SCREENSHOTS --- */
    const storeData = [
        { n: "Roblox", img: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg", pk: [{l: "1000 Robux", p: "12"}, {l: "2000 Robux", p: "23"}] },
        { n: "Riot Client", img: "https://static.wikia.nocookie.net/logopedia/images/d/d4/Riot_Games_2022.svg", pk: [{l: "1000 RP", p: "13"}, {l: "2500 RP", p: "31"}] },
        { n: "EA App", img: "https://upload.wikimedia.org/wikipedia/commons/0/0d/Electronic-Arts-Logo.svg", pk: [{l: "$15 Card", p: "17"}, {l: "$25 Card", p: "28"}] },
        { n: "FC 26 Points", img: "https://media.rawg.io/media/games/052/052ccae9ef18037f485f6170087a5f48.jpg", pk: [{l: "1050 Points", p: "OUT OF STOCK"}, {l: "2800 Points", p: "OUT OF STOCK"}] },
        { n: "Steam Card", img: "https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg", pk: [{l: "$10 Wallet", p: "13"}, {l: "$20 Wallet", p: "24"}] },
        { n: "Xbox Link", img: "https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg", pk: [{l: "$10 Gift Card", p: "12"}, {l: "$25 Gift Card", p: "28"}] },
        { n: "Discord Nitro", img: "https://www.svgrepo.com/show/353655/discord-icon.svg", pk: [{l: "1 Month Boost", p: "12"}] },
        { n: "PlayStation", img: "https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg", pk: [{l: "$10 PSN", p: "12"}] }
    ];

    let basket = [];

    function renderStore() {
        const grid = document.getElementById('store-grid');
        grid.innerHTML = '';
        storeData.forEach((it, i) => {
            grid.innerHTML += `
                <div class="card">
                    <div class="card-img-wrap"><img src="${it.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'"></div>
                    <h3>${it.n}</h3>
                    <button class="btn btn-outline" onclick="openPack(${i})">SELECT PACK</button>
                </div>`;
        });
        grid.innerHTML += `<div class="card" style="border:1px dashed var(--border); opacity:0.6"><h3>+ MORE COMING</h3></div>`;
    }

    function openPack(i) {
        const it = storeData[i];
        document.getElementById('m-title').innerText = it.n;
        const box = document.getElementById('m-opts');
        box.innerHTML = '';
        it.pk.forEach(p => {
            const isOOS = p.p.toUpperCase() === "OUT OF STOCK";
            box.innerHTML += `
                <div class="pack-row ${isOOS ? 'oos' : ''}" onclick="${isOOS ? '' : `add('${it.n}','${p.l}','${p.p}')`}">
                    <span>${p.l}</span>
                    <b>${isOOS ? 'OOS' : '$'+p.p}</b>
                </div>`;
        });
        document.getElementById('sys-overlay').style.display = 'block';
        document.getElementById('pack-modal').style.display = 'block';
    }

    function add(n, l, p) {
        basket.push({n, l, p});
        updCart(); closeAll();
        toggleDrawer('cart-drawer', true);
    }

    function updCart() {
        document.getElementById('cart-count').innerText = basket.length;
        const list = document.getElementById('cart-items');
        let total = 0; list.innerHTML = '';
        basket.forEach((x, i) => {
            total += parseFloat(x.p);
            list.innerHTML += `<div style="background:#000; padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between">
                <div><b>${x.n}</b><br><small style="color:var(--text-muted)">${x.l}</small></div>
                <div style="display:flex; gap:10px; align-items:center"><b>$${x.p}</b><span onclick="basket.splice(${i},1);updCart()" style="color:red; cursor:pointer">✕</span></div>
            </div>`;
        });
        document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    function authAdmin() {
        if(prompt("Enter Admin PIN:") === "1234") {
            document.getElementById('admin-dash').style.display = 'block';
            renderAdmin();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    }

    function renderAdmin() {
        const content = document.getElementById('admin-editor-content');
        content.innerHTML = '';
        storeData.forEach((it, i) => {
            let itemHtml = `<div class="admin-box"><h4>${it.n}</h4><hr style="opacity:0.1; margin:10px 0">`;
            it.pk.forEach((p, pi) => {
                itemHtml += `
                    <div class="admin-input-group">
                        <small>${p.l}</small>
                        <input type="text" class="admin-input" value="${p.p}" oninput="updateLivePrice(${i}, ${pi}, this.value)">
                    </div>`;
            });
            itemHtml += `</div>`;
            content.innerHTML += itemHtml;
        });
    }

    function updateLivePrice(itIdx, pkIdx, val) {
        storeData[itIdx].pk[pkIdx].p = val;
        renderStore();
    }

    function closeAdmin() { document.getElementById('admin-dash').style.display = 'none'; }

    function toggleDrawer(id, state) {
        if(state) document.getElementById('sys-overlay').style.display = 'block';
        document.getElementById(id).classList.toggle('open', state);
    }

    function closeAll() {
        document.getElementById('sys-overlay').style.display = 'none';
        document.getElementById('pack-modal').style.display = 'none';
        document.getElementById('cart-drawer').classList.remove('open');
    }

    function checkout() {
        if(!basket.length) return;
        let msg = `🛒 *BJ'S STORE ORDER*\n\n`;
        basket.forEach(it => msg += `• ${it.n}: ${it.l} ($${it.p})\n`);
        window.open(`https://wa.me/96181094708?text=${encodeURIComponent(msg)}`);
    }

    renderStore();
</script>
</body>
</html>
