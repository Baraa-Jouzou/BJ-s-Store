<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baraa | Elite TopUp</title>
    <style>
        :root {
            --primary: #25D366;
            --accent: #00f2ff;
            --bg: #050505;
            --card-bg: #111111;
            --border: #222222;
            --text: #ffffff;
        }

        .neon-mode {
            --bg: #0a0118;
            --card-bg: #1a0b2e;
            --border: #442288;
            --accent: #ff00ff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; transition: 0.3s ease; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(37, 211, 102, 0.05) 0%, transparent 80%);
        }

        /* Anti-Twitch Image Fix */
        .img-container {
            width: 100px; height: 100px; margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            background: #000; border-radius: 20px; overflow: hidden;
            border: 1px solid var(--border);
            will-change: transform;
        }
        .img-container img { 
            max-width: 80%; max-height: 80%; 
            object-fit: contain;
            backface-visibility: hidden;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            display: flex; justify-content: space-between;
            padding: 15px 5%; align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .btn {
            border: none; padding: 10px 20px; border-radius: 12px;
            font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-p { background: var(--primary); color: white; }
        .btn-s { background: var(--card-bg); color: white; border: 1px solid var(--border); }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.2); box-shadow: 0 5px 15px rgba(0,0,0,0.4); }

        .grid {
            display: grid; padding: 40px 5%;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 30px; padding: 30px; text-align: center;
            position: relative;
        }
        .card:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--border); }

        .stock-tag {
            font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--primary); background: rgba(37, 211, 102, 0.1);
            padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 10px;
        }

        /* Drawer System */
        .drawer {
            position: fixed; top: 0; width: 400px; max-width: 90vw; height: 100%;
            background: var(--bg); z-index: 200; padding: 40px;
            border-left: 1px solid var(--border); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .drawer.right { right: 0; transform: translateX(100%); }
        .drawer.left { left: 0; transform: translateX(-100%); }
        .drawer.open { transform: translateX(0); }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; z-index: 150; backdrop-filter: blur(5px);
        }

        /* Modal */
        .modal {
            position: fixed; inset: 0; display: none;
            justify-content: center; align-items: center; z-index: 300;
        }
        .modal-box {
            background: var(--card-bg); padding: 40px; border-radius: 35px;
            width: 90%; max-width: 450px; border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .pack-item {
            background: var(--bg); border: 1px solid var(--border);
            padding: 18px; border-radius: 15px; margin: 10px 0;
            display: flex; justify-content: space-between; cursor: pointer;
        }
        .pack-item:hover { border-color: var(--primary); background: rgba(255,255,255,0.05); }

        .search-area { padding: 20px 5% 0; display: flex; gap: 10px; }
        input { 
            flex: 1; padding: 15px; border-radius: 15px; 
            background: var(--card-bg); border: 1px solid var(--border); color: white;
        }
    </style>
</head>
<body>

<header>
    <div style="font-size: 1.5rem; font-weight: 800;">BARAA <span style="color:var(--primary)">PRO</span></div>
    <div style="display:flex; gap:10px;">
        <button class="btn btn-s" onclick="document.body.classList.toggle('neon-mode')">✨ Style</button>
        <button class="btn btn-s" onclick="toggleD('admin', true)">Admin</button>
        <button class="btn btn-p" onclick="toggleD('cart', true)">🛒 <span id="cart-count">0</span></button>
    </div>
</header>

<div class="search-area">
    <input type="text" id="search" placeholder="Search for cards..." oninput="render()">
</div>

<div class="grid" id="main-grid"></div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="drawer right" id="cart-drawer">
    <h2>Your Order</h2>
    <div id="cart-list" style="margin: 20px 0;"></div>
    <div style="border-top: 1px solid var(--border); padding-top: 20px;">
        <div style="display:flex; justify-content:space-between; font-size:1.5rem; margin-bottom:20px;">
            <span>Total:</span>
            <b id="total-price">$0</b>
        </div>
        <button class="btn btn-p" style="width:100%; justify-content:center; padding:18px;" onclick="checkout()">Checkout on WhatsApp</button>
    </div>
</div>

<div class="drawer left" id="admin-drawer">
    <h2>Admin Panel</h2>
    <input type="password" id="pass" placeholder="Password">
    <button class="btn btn-p" style="width:100%; justify-content:center" onclick="login()">Enter</button>
    <div id="admin-editor" style="display:none; margin-top:30px;">
        <button class="btn btn-s" style="width:100%; color:red" onclick="reset()">Reset Everything</button>
        <div id="price-fields"></div>
    </div>
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <h2 id="modal-title" style="margin-top:0"></h2>
        <div id="modal-options"></div>
        <button class="btn btn-s" style="width:100%; justify-content:center; margin-top:20px" onclick="closeAll()">Close</button>
    </div>
</div>

<script>
    const DATA = {
        phone: "96181094708",
        pass: "1234",
        defaults: [
            { name: "Roblox", img: "https://upload.wikimedia.org/wikipedia/commons/7/7e/Roblox_Logo_2022.jpg", packs: [{l: "800 Robux", p: 10}, {l: "1700 Robux", p: 20}] },
            { name: "Steam", img: "https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg", packs: [{l: "$5 Card", p: 6}, {l: "$20 Card", p: 22}] },
            { name: "PlayStation", img: "https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg", packs: [{l: "$10 Card", p: 10}, {l: "$50 Card", p: 50}] },
            { name: "Netflix", img: "https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg", packs: [{l: "$25 Card", p: 25}, {l: "$50 Card", p: 50}] },
            { name: "Xbox", img: "https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg", packs: [{l: "$10 Card", p: 10}, {l: "$25 Card", p: 25}] },
            { name: "iTunes", img: "https://upload.wikimedia.org/wikipedia/commons/d/df/ITunes_logo.svg", packs: [{l: "$5 Card", p: 6}, {l: "$10 Card", p: 11}] }
        ]
    };

    let items = JSON.parse(localStorage.getItem("baraa_v4")) || DATA.defaults;
    let cart = [];

    function render() {
        const grid = document.getElementById('main-grid');
        const q = document.getElementById('search').value.toLowerCase();
        grid.innerHTML = '';
        
        items.forEach((item, idx) => {
            if(q && !item.name.toLowerCase().includes(q)) return;
            grid.innerHTML += `
                <div class="card">
                    <div class="stock-tag">Instock</div>
                    <div class="img-container">
                        <img src="${item.img}" alt="${item.name}">
                    </div>
                    <h3 style="margin:0 0 20px 0">${item.name}</h3>
                    <button class="btn btn-p" style="width:100%; justify-content:center" onclick="openPacks(${idx})">Select Pack</button>
                </div>
            `;
        });
    }

    function openPacks(idx) {
        const item = items[idx];
        document.getElementById('modal-title').innerText = item.name;
        const box = document.getElementById('modal-options');
        box.innerHTML = '';
        item.packs.forEach(p => {
            box.innerHTML += `
                <div class="pack-item" onclick="add('${item.name}', '${p.l}', ${p.p})">
                    <span>${p.l}</span>
                    <b style="color:var(--primary)">$${p.p}</b>
                </div>
            `;
        });
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('modal').style.display = 'flex';
    }

    function add(name, label, price) {
        cart.push({name, label, price});
        updateCart();
        closeAll();
    }

    function updateCart() {
        document.getElementById('cart-count').innerText = cart.length;
        const list = document.getElementById('cart-list');
        let total = 0;
        list.innerHTML = '';
        cart.forEach((c, i) => {
            total += c.price;
            list.innerHTML += `
                <div style="background:var(--card-bg); padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between">
                    <span>${c.name} - ${c.label}</span>
                    <b onclick="remove(${i})" style="color:red; cursor:pointer">✕</b>
                </div>
            `;
        });
        document.getElementById('total-price').innerText = `$${total}`;
    }

    function remove(i) { cart.splice(i, 1); updateCart(); }

    function toggleD(id, show) {
        document.getElementById(`${id}-drawer`).classList.toggle('open', show);
        document.getElementById('overlay').style.display = show ? 'block' : 'none';
    }

    function closeAll() {
        document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
        document.getElementById('modal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function login() {
        if(document.getElementById('pass').value === DATA.pass) {
            document.getElementById('admin-editor').style.display = 'block';
            loadAdmin();
        } else alert("Wrong!");
    }

    function loadAdmin() {
        const div = document.getElementById('price-fields');
        div.innerHTML = '';
        items.forEach((item, i) => {
            item.packs.forEach((p, pi) => {
                div.innerHTML += `
                    <div style="margin:10px 0">
                        <small>${item.name} ${p.l}</small>
                        <input type="number" value="${p.p}" onchange="updatePrice(${i},${pi},this.value)">
                    </div>
                `;
            });
        });
    }

    function updatePrice(i, pi, val) {
        items[i].packs[pi].p = Number(val);
        localStorage.setItem("baraa_v4", JSON.stringify(items));
        render();
    }

    function reset() { localStorage.removeItem("baraa_v4"); location.reload(); }

    function checkout() {
        if(cart.length === 0) return alert("Empty cart!");
        let total = 0;
        let txt = "*BARAA STORE ORDER*%0A%0A";
        cart.forEach(c => { txt += `⚡ ${c.name} - ${c.label} ($${c.price})%0A`; total += c.price; });
        txt += `%0A*TOTAL: $${total}*`;
        window.open(`https://wa.me/${DATA.phone}?text=${txt}`, "_blank");
    }

    render();
</script>
</body>
</html>
