<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BJ's Store | Premium Digital Goods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --p: #00ff88;
  --p-dim: #00cc6a;
  --p-glow: rgba(0,255,136,0.25);
  --p-glow2: rgba(0,255,136,0.08);
  --bg: #040406;
  --surface: #0c0c10;
  --surface2: #12121a;
  --glass: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.07);
  --border-bright: rgba(255,255,255,0.14);
  --text: #f0f0f0;
  --text-muted: #666;
  --text-mid: #999;
  --red: #ff4455;
  --gold: #ffd166;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--p);border-radius:10px}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  top:-200px;left:50%;
  transform:translateX(-50%);
  width:900px;height:600px;
  background:radial-gradient(ellipse at center, rgba(0,255,136,0.06) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

nav{
  position:sticky;top:0;z-index:900;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 5%;height:62px;
  background:rgba(4,4,6,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{
  font-family:'Syncopate',sans-serif;
  font-size:1rem;letter-spacing:2px;
  cursor:pointer;user-select:none;
}
.brand span{color:var(--p)}
.nav-right{display:flex;gap:8px;align-items:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:10px;font-weight:700;
  border:none;cursor:pointer;font-size:0.75rem;
  letter-spacing:0.5px;transition:all 0.2s;text-transform:uppercase;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.btn:active{transform:scale(0.95)}
.btn-primary{background:var(--p);color:#000;box-shadow:0 0 20px var(--p-glow);}
.btn-primary:hover{background:#1aff95;box-shadow:0 0 30px rgba(0,255,136,0.4)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border-bright)}
.btn-outline{
  background:transparent;color:var(--p);
  border:1px solid rgba(0,255,136,0.3);
  width:100%;padding:12px;margin-top:12px;
  border-radius:12px;
}
.btn-outline:hover{background:rgba(0,255,136,0.06);border-color:var(--p)}
.btn-danger{background:var(--red);color:#fff}

.search-wrap{
  padding:20px 5% 0;
  position:relative;max-width:600px;margin:0 auto;
}
.search-input{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:14px;
  padding:13px 18px 13px 46px;color:var(--text);
  font-size:0.9rem;outline:none;transition:border-color 0.2s;
}
.search-input::placeholder{color:var(--text-muted)}
.search-input:focus{border-color:rgba(0,255,136,0.4)}
.search-icon{
  position:absolute;left:calc(5% + 16px);top:50%;
  transform:translateY(-50%);color:var(--text-muted);
  font-size:1rem;pointer-events:none;
}
@media(min-width:600px){
  .search-wrap{padding:24px 5% 0}
}

.cats{
  display:flex;gap:8px;overflow-x:auto;
  padding:16px 5%;scrollbar-width:none;
}
.cats::-webkit-scrollbar{display:none}
.cat-btn{
  flex-shrink:0;padding:7px 16px;border-radius:20px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text-mid);font-size:0.75rem;font-weight:600;
  cursor:pointer;transition:all 0.2s;letter-spacing:0.3px;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.cat-btn.active{background:var(--p);color:#000;border-color:var(--p)}
.cat-btn:hover:not(.active){border-color:var(--border-bright);color:var(--text)}

.section-title{
  padding:4px 5% 16px;
  font-size:0.7rem;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--text-muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;padding:0 5% 30px;
}
@media(min-width:540px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(5,1fr)}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;padding:18px 14px 14px;
  display:flex;flex-direction:column;
  transition:border-color 0.25s, transform 0.2s, box-shadow 0.25s;
  cursor:pointer;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%, var(--p-glow2), transparent 70%);
  opacity:0;transition:opacity 0.3s;
}
.card:hover{border-color:rgba(0,255,136,0.35);box-shadow:0 8px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,255,136,0.1);}
.card:hover::before{opacity:1}
.card:active{transform:scale(0.97)}

.badge{
  position:absolute;top:10px;right:10px;
  font-size:0.6rem;font-weight:800;padding:3px 8px;
  border-radius:20px;letter-spacing:0.5px;text-transform:uppercase;
}
.badge-hot{background:var(--red);color:#fff}
.badge-new{background:var(--gold);color:#000}

.card-img-wrap{
  width:56px;height:56px;margin:0 auto 14px;
  background:#fff;border-radius:14px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  flex-shrink:0;
}
.card-img-wrap img{width:36px;height:36px;object-fit:contain}
.card h3{font-size:0.82rem;font-weight:700;text-align:center;margin-bottom:4px;line-height:1.3;}
.card-subtitle{font-size:0.68rem;color:var(--text-muted);text-align:center;margin-bottom:10px;}
.card-price{font-size:0.8rem;color:var(--p);font-weight:700;text-align:center;margin-bottom:2px;}

.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state .emoji{font-size:2.5rem;margin-bottom:12px}

.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(6px);
  display:none;z-index:1000;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.drawer{
  position:fixed;top:0;right:-105%;
  width:100%;max-width:420px;height:100%;
  background:var(--surface);
  z-index:1100;
  transition:right 0.38s cubic-bezier(0.16,1,0.3,1);
  display:flex;flex-direction:column;
  border-left:1px solid var(--border);
}
.drawer.open{right:0}
.drawer-header{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
}
.drawer-header h2{font-family:'Syncopate',sans-serif;font-size:0.8rem;letter-spacing:1px;}
.drawer-body{flex:1;overflow-y:auto;padding:16px}
.drawer-footer{padding:16px 20px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;}

.cart-item{
  background:var(--surface2);border:1px solid var(--border);
  padding:14px;border-radius:14px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;animation:slideIn 0.25s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:0.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-label{font-size:0.72rem;color:var(--text-muted);margin-top:2px}
.cart-item-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.cart-item-price{font-weight:800;color:var(--p);font-size:0.9rem}
.remove-btn{
  color:var(--red);cursor:pointer;font-size:1rem;padding:4px;
  border-radius:6px;transition:background 0.15s;
  background:none;border:none;display:flex;align-items:center;justify-content:center;
}
.remove-btn:hover{background:rgba(255,68,85,0.12)}
.cart-empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
.cart-empty .emoji{font-size:2rem;margin-bottom:10px}
.cart-empty p{font-size:0.85rem}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cart-total-label{font-size:0.75rem;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase}
.cart-total-val{font-size:1.5rem;font-weight:800;color:var(--p)}

.modal{
  position:fixed;bottom:-100%;left:0;right:0;
  background:var(--surface);
  border-radius:24px 24px 0 0;
  border-top:1px solid var(--border);
  z-index:1200;max-height:85vh;
  display:flex;flex-direction:column;
  transition:bottom 0.38s cubic-bezier(0.16,1,0.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.modal.open{bottom:0}
@media(min-width:600px){
  .modal{
    left:50%;right:auto;bottom:auto;top:50%;
    transform:translate(-50%,-50%);
    width:90%;max-width:440px;border-radius:20px;
    border:1px solid var(--border);max-height:80vh;
    transition:none;opacity:0;pointer-events:none;
  }
  .modal.open{bottom:auto;top:50%;opacity:1;pointer-events:all;transition:opacity 0.25s ease;transform:translate(-50%,-50%);}
}
.modal-handle{width:36px;height:4px;background:var(--border-bright);border-radius:10px;margin:10px auto 0;flex-shrink:0;}
@media(min-width:600px){.modal-handle{display:none}}
.modal-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
}
.modal-title{font-family:'Syncopate',sans-serif;font-size:0.8rem;letter-spacing:1px;color:var(--p);}
.modal-body{overflow-y:auto;padding:14px}

.pack-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px;border-radius:14px;margin-bottom:8px;cursor:pointer;
  background:var(--glass);border:1px solid var(--border);transition:all 0.18s;
}
.pack-row:hover{border-color:rgba(0,255,136,0.4);background:rgba(0,255,136,0.04);}
.pack-row:active{transform:scale(0.98)}
.pack-label{font-size:0.85rem;font-weight:600}
.pack-sub{font-size:0.7rem;color:var(--red);font-weight:700;margin-top:3px}
.pack-price{font-size:1rem;font-weight:800;color:var(--p);white-space:nowrap;}

#admin-dash{
  display:none;border-bottom:1px solid var(--border);
  background:var(--surface);animation:slideDown 0.3s ease;position:relative;z-index:800;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.admin-bar{padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.admin-bar h2{font-family:'Syncopate',sans-serif;font-size:0.75rem;letter-spacing:2px;color:var(--p);}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px 5%;}
.admin-box{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px;}
.admin-box h4{font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.admin-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.admin-row:last-child{border-bottom:none}
.admin-row-label{font-size:0.72rem;color:var(--text-mid);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-input{width:64px;background:#000;border:1px solid var(--border);color:var(--p);padding:5px 6px;border-radius:7px;text-align:center;font-weight:800;font-size:0.8rem;outline:none;}
.admin-input:focus{border-color:var(--p)}

.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--surface2);border:1px solid var(--border);
  padding:12px 20px;border-radius:12px;
  font-size:0.82rem;font-weight:600;white-space:nowrap;
  z-index:9999;transition:transform 0.3s cubic-bezier(0.16,1,0.3,1), opacity 0.3s;
  opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

footer{padding:30px 5%;text-align:center;border-top:1px solid var(--border);color:var(--text-muted);font-size:0.72rem;margin-top:10px;}
footer span{color:var(--p)}

#scroll-top{
  position:fixed;bottom:24px;right:20px;width:40px;height:40px;border-radius:12px;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:1rem;
  cursor:pointer;z-index:500;display:none;align-items:center;justify-content:center;transition:all 0.2s;
}
#scroll-top.visible{display:flex}
#scroll-top:hover{border-color:var(--p);color:var(--p)}
</style>
</head>
<body>

<nav>
  <div class="brand" onclick="goHome()">BJ'S<span> STORE</span></div>
  <div class="nav-right">
    <button class="btn btn-ghost" onclick="authAdmin()" style="padding:8px 12px">⚙️</button>
    <button class="btn btn-primary" onclick="openCart()">🛒 <span id="cart-count">0</span></button>
  </div>
</nav>

<div id="admin-dash">
  <div class="admin-bar">
    <h2>Admin Console</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" style="font-size:0.7rem" onclick="resetData()">Reset to Default</button>
      <button class="btn btn-danger" onclick="closeAdmin()">✕ Close</button>
    </div>
  </div>
  <div class="admin-grid" id="admin-editor-content"></div>
  <div style="padding:0 5% 16px">
    <p style="font-size:0.7rem;color:var(--text-muted)">Changes save automatically. Prices in USD ($).</p>
  </div>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-input" type="text" placeholder="Search products…" id="search-input" oninput="filterProducts()" autocomplete="off">
</div>

<div class="cats" id="cats-bar"></div>
<div class="section-title" id="section-label">All Products</div>
<div class="grid" id="store-grid"></div>

<footer>&copy; 2025 <span>BJ's Store</span> — Premium Digital Goods Lebanon 🇱🇧</footer>

<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div class="overlay" id="sys-overlay" onclick="closeAll()"></div>

<div class="drawer" id="cart-drawer">
  <div class="drawer-header">
    <h2>Your Cart</h2>
    <button class="btn btn-ghost" onclick="closeAll()" style="padding:6px 10px">✕</button>
  </div>
  <div class="drawer-body" id="cart-items"></div>
  <div class="drawer-footer">
    <div class="cart-total-row">
      <span class="cart-total-label">Total</span>
      <span class="cart-total-val" id="cart-total">$0.00</span>
    </div>
    <button class="btn btn-primary" style="width:100%;padding:16px;font-size:0.85rem" onclick="checkout()">📲 Order via WhatsApp</button>
    <button class="btn btn-ghost" style="width:100%;padding:12px;margin-top:8px;font-size:0.75rem" onclick="clearCart()">🗑 Clear Cart</button>
  </div>
</div>

<div class="modal" id="pack-modal">
  <div class="modal-handle"></div>
  <div class="modal-header">
    <span class="modal-title" id="modal-title">Select Pack</span>
    <button class="btn btn-ghost" onclick="closeAll()" style="padding:6px 10px">✕</button>
  </div>
  <div class="modal-body" id="modal-opts"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_DB = [
  {
    n:"Roblox", cat:"Gaming",
    img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg",
    pk:[
      {l:"1000 Robux", p:"12"},
      {l:"2000 Robux", p:"23"}
    ]
  },
  {
    n:"Riot Client", cat:"Gaming",
    img:"https://upload.wikimedia.org/wikipedia/commons/1/11/Riot_Games_logo_icon.svg",
    pk:[
      {l:"1000 RP", p:"14"},
      {l:"2500 RP", p:"31"}
    ]
  },
  {
    n:"EA App", cat:"Gaming",
    img:"https://upload.wikimedia.org/wikipedia/commons/0/0d/Electronic-Arts-Logo.svg",
    pk:[
      {l:"$15 Card", p:"17"},
      {l:"$25 Card", p:"28"}
    ]
  },
  {
    n:"FC 26 Points", cat:"Gaming",
    img:"https://cdn-icons-png.flaticon.com/512/702/702115.png",
    pk:[
      {l:"1050 Points", p:"12"},
      {l:"2800 Points", p:"25"}
    ]
  },
  {
    n:"Steam Card", cat:"Gaming",
    img:"https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg",
    pk:[
      {l:"$10 Wallet", p:"12"},
      {l:"$20 Wallet", p:"23"}
    ]
  },
  {
    n:"Xbox Link", cat:"Gaming",
    img:"https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg",
    pk:[
      {l:"$10 Gift Card", p:"12"},
      {l:"$25 Gift Card", p:"28"}
    ]
  },
  {
    n:"Discord Nitro", cat:"Subscriptions",
    img:"https://www.svgrepo.com/show/353655/discord-icon.svg",
    pk:[
      {l:"1 Month Boost", p:"12"}
    ]
  },
  {
    n:"PlayStation", cat:"Gaming",
    img:"https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg",
    pk:[
      {l:"🇱🇧 Lebanon $10 PSN", p:"12"},
      {l:"🇱🇧 Lebanon $20 PSN", p:"23"},
      {l:"🇺🇸 USA $10 PSN",     p:"12"},
      {l:"🇺🇸 USA $20 PSN",     p:"23"}
    ]
  },
  {
    n:"Anghami", cat:"Music",
    img:"https://upload.wikimedia.org/wikipedia/commons/b/b5/Anghami_logo.svg",
    pk:[
      {l:"1 Month Plus",             p:"7"},
      {l:"(HOT DEAL) 3 Months Plus", p:"11", hot:true}
    ]
  },
  {
    n:"Spotify", cat:"Music",
    img:"https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg",
    pk:[
      {l:"1 Month Premium", p:"8"}
    ]
  }
];

const CATEGORIES = ["All","Gaming","Subscriptions","Music"];
let storeData = [];
let basket = [];
let activeCategory = "All";
let searchQuery = "";

function init() {
  try {
    const saved = localStorage.getItem("bj_store_v5");
    storeData = saved ? JSON.parse(saved) : deepClone(DEFAULT_DB);
  } catch(e) { storeData = deepClone(DEFAULT_DB); }
  try {
    const savedCart = localStorage.getItem("bj_cart_v1");
    basket = savedCart ? JSON.parse(savedCart) : [];
  } catch(e) { basket = []; }
  renderCats();
  renderStore();
  updateCartUI();
  window.addEventListener("scroll", () => {
    document.getElementById("scroll-top").classList.toggle("visible", window.scrollY > 300);
  });
}

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }
function saveStore(){ localStorage.setItem("bj_store_v5", JSON.stringify(storeData)); }
function saveCart(){ localStorage.setItem("bj_cart_v1", JSON.stringify(basket)); }

function renderCats(){
  document.getElementById("cats-bar").innerHTML = CATEGORIES.map(c =>
    `<button class="cat-btn ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`
  ).join("");
}

function setCategory(cat){
  activeCategory = cat;
  searchQuery = "";
  document.getElementById("search-input").value = "";
  renderCats();
  renderStore();
}

function filterProducts(){
  searchQuery = document.getElementById("search-input").value.trim().toLowerCase();
  activeCategory = "All";
  renderCats();
  renderStore();
}

function renderStore(){
  const grid = document.getElementById("store-grid");
  const label = document.getElementById("section-label");
  let data = storeData;
  if(activeCategory !== "All") data = data.filter(it => it.cat === activeCategory);
  if(searchQuery) data = data.filter(it => it.n.toLowerCase().includes(searchQuery));
  label.textContent = searchQuery ? `Results for "${searchQuery}"` : activeCategory === "All" ? "All Products" : activeCategory;
  if(!data.length){
    grid.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><p>No products found</p></div>`;
    return;
  }
  grid.innerHTML = data.map(it => {
    const origIdx = storeData.indexOf(it);
    const minPrice = Math.min(...it.pk.map(p => parseFloat(p.p)));
    const badgeHtml = it.badge === "hot" ? '<span class="badge badge-hot">Hot</span>'
      : it.badge === "new" ? '<span class="badge badge-new">New</span>' : "";
    return `
      <div class="card" onclick="openPack(${origIdx})">
        ${badgeHtml}
        <div>
          <div class="card-img-wrap">
            <img src="${escHtml(it.img)}" alt="${escHtml(it.n)}"
              onerror="this.src='https://cdn-icons-png.flaticon.com/512/702/702115.png'" loading="lazy">
          </div>
          <h3>${escHtml(it.n)}</h3>
          <div class="card-subtitle">${it.pk.length} option${it.pk.length!==1?'s':''}</div>
          <div class="card-price">from $${minPrice.toFixed(2)}</div>
        </div>
        <button class="btn btn-outline">View Packs</button>
      </div>`;
  }).join("");
}

function openPack(i){
  const it = storeData[i];
  if(!it) return;
  document.getElementById("modal-title").textContent = it.n;
  const box = document.getElementById("modal-opts");
  box.innerHTML = it.pk.map((p,pi) => `
    <div class="pack-row" onclick="addToBasket(${i},${pi})">
      <div>
        <div class="pack-label">${escHtml(p.l)}</div>
        ${p.hot ? '<div class="pack-sub">⚡ Special Deal</div>' : ""}
      </div>
      <div class="pack-price">$${parseFloat(p.p).toFixed(2)}</div>
    </div>`).join("");
  box.innerHTML += `<button class="btn btn-ghost" style="width:100%;padding:13px;margin-top:4px" onclick="closeAll()">Cancel</button>`;
  showOverlay();
  document.getElementById("pack-modal").classList.add("open");
}

function addToBasket(itemIdx, packIdx){
  const it = storeData[itemIdx];
  const pk = it.pk[packIdx];
  basket.push({n:it.n, l:pk.l, p:pk.p});
  saveCart();
  updateCartUI();
  closeAll();
  setTimeout(() => openCart(), 100);
  showToast(`✅ Added: ${it.n}`);
}

function removeFromBasket(i){ basket.splice(i,1); saveCart(); updateCartUI(); }

function clearCart(){
  if(!basket.length) return;
  basket = [];
  saveCart();
  updateCartUI();
  showToast("🗑 Cart cleared");
}

function updateCartUI(){
  const count = basket.length;
  document.getElementById("cart-count").textContent = count;
  const list = document.getElementById("cart-items");
  if(!count){
    list.innerHTML = `<div class="cart-empty"><div class="emoji">🛒</div><p>Your cart is empty.<br>Add some products!</p></div>`;
    document.getElementById("cart-total").textContent = "$0.00";
    return;
  }
  const total = basket.reduce((acc,x) => acc + parseFloat(x.p), 0);
  list.innerHTML = basket.map((x,i) => `
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-name">${escHtml(x.n)}</div>
        <div class="cart-item-label">${escHtml(x.l)}</div>
      </div>
      <div class="cart-item-right">
        <span class="cart-item-price">$${parseFloat(x.p).toFixed(2)}</span>
        <button class="remove-btn" onclick="removeFromBasket(${i})">✕</button>
      </div>
    </div>`).join("");
  document.getElementById("cart-total").textContent = `$${total.toFixed(2)}`;
}

function openCart(){ showOverlay(); document.getElementById("cart-drawer").classList.add("open"); }

function checkout(){
  if(!basket.length){ showToast("⚠️ Cart is empty!"); return; }
  const total = basket.reduce((acc,x) => acc + parseFloat(x.p), 0);
  let msg = `🛒 *NEW ORDER — BJ'S STORE*\n\n`;
  basket.forEach(it => { msg += `• *${it.n}*\n  ${it.l} — $${parseFloat(it.p).toFixed(2)}\n\n`; });
  msg += `──────────────────\n💰 *Total: $${total.toFixed(2)}*\n\nPlease confirm my order. Thank you!`;
  window.open(`https://wa.me/96181094708?text=${encodeURIComponent(msg)}`, "_blank");
}

function authAdmin(){
  const pin = prompt("Enter Admin PIN:");
  if(pin === null) return;
  if(pin === "1234"){
    document.getElementById("admin-dash").style.display = "block";
    renderAdmin();
    window.scrollTo({top:0,behavior:"smooth"});
  } else { showToast("❌ Incorrect PIN"); }
}

function renderAdmin(){
  document.getElementById("admin-editor-content").innerHTML = storeData.map((it,i) => `
    <div class="admin-box">
      <h4>${escHtml(it.n)}</h4>
      ${it.pk.map((p,pi) => `
        <div class="admin-row">
          <span class="admin-row-label">${escHtml(p.l)}</span>
          <span style="color:var(--text-muted);font-size:0.7rem;margin-right:4px">$</span>
          <input type="number" step="0.01" min="0" class="admin-input" value="${p.p}" onchange="updatePrice(${i},${pi},this.value)">
        </div>`).join("")}
    </div>`).join("");
}

function updatePrice(itIdx,pkIdx,val){
  const num = parseFloat(val);
  if(isNaN(num)||num<0) return;
  storeData[itIdx].pk[pkIdx].p = num.toFixed(2);
  saveStore(); renderStore();
  showToast("💾 Price updated");
}

function resetData(){
  if(!confirm("Reset all prices to default?")) return;
  storeData = deepClone(DEFAULT_DB);
  saveStore(); renderAdmin(); renderStore();
  showToast("↩️ Reset to default");
}

function closeAdmin(){ document.getElementById("admin-dash").style.display = "none"; }

function showOverlay(){
  document.getElementById("sys-overlay").style.display = "block";
  document.body.style.overflow = "hidden";
}

function closeAll(){
  document.getElementById("sys-overlay").style.display = "none";
  document.getElementById("pack-modal").classList.remove("open");
  document.getElementById("cart-drawer").classList.remove("open");
  document.body.style.overflow = "";
}

function goHome(){
  activeCategory = "All"; searchQuery = "";
  document.getElementById("search-input").value = "";
  renderCats(); renderStore();
  window.scrollTo({top:0,behavior:"smooth"});
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

function escHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

init();
</script>
</body>
</html>
